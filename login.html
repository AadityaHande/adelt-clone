<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Adelt</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <main class="min-vh-100 d-flex align-items-center py-4">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-12 col-md-10 col-lg-8 col-xl-7">
                    <div class="card border-0 shadow-lg overflow-hidden rounded-4">
                        <div class="row g-0">
                            <div class="col-lg-5 bg-dark text-white p-4 p-md-5 d-flex flex-column justify-content-between">
                                <div>
                                    <p class="text-uppercase small text-white-50 mb-2">Adelt</p>
                                    <h1 class="h3 fw-bold mb-3">Welcome back</h1>
                                    <p class="mb-0 text-white-50">Sign in to continue to your dashboard and manage your projects.</p>
                                </div>
                                <ul class="list-unstyled small mb-0 mt-4">
                                    <li class="mb-2">Safe login </li>
                                    <li class="mb-2">Bootstrap CSS styling</li>
                                    <li>with Javascript</li>
                                </ul>
                            </div>

                            <div class="col-lg-7 bg-white p-4 p-md-5">
                                <h2 class="h4 fw-semibold mb-1">Login</h2>
                                <p class="text-secondary mb-4">Enter your details to sign in.</p>

                                <form id="loginForm" novalidate>
                                    <div class="mb-3">
                                        <label for="email" class="form-label">Email address</label>
                                        <input type="email" class="form-control" id="email" placeholder="name@example.com">
                                        <div class="invalid-feedback">Please enter a valid email address.</div>
                                    </div>

                                    <div class="mb-3">
                                        <label for="password" class="form-label">Password</label>
                                        <div class="input-group">
                                            <input type="password" class="form-control" id="password" placeholder="Your password">
                                            <button class="btn btn-outline-secondary" type="button" id="togglePassword">Show</button>
                                            <div class="invalid-feedback">Password is required.</div>
                                        </div>
                                    </div>

                                    <div class="d-flex justify-content-between align-items-center mb-4 gap-3 flex-wrap">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" value="" id="rememberMe">
                                            <label class="form-check-label" for="rememberMe">Remember me</label>
                                        </div>
                                        <a href="#" class="link-secondary text-decoration-none">Forgot password?</a>
                                    </div>

                                    <button type="submit" class="btn btn-dark w-100">Sign in</button>
                                </form>

                                <p class="text-center text-secondary small mt-4 mb-0">
                                    Don't have an account? <a href="register.html" class="link-dark fw-semibold text-decoration-none">Create one</a>
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const togglePassword = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const emailInput = document.getElementById('email');
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        togglePassword.addEventListener('click', function () {
            const isHidden = passwordInput.type === 'password';
            passwordInput.type = isHidden ? 'text' : 'password';
            togglePassword.textContent = isHidden ? 'Hide' : 'Show';
        });

        loginForm.addEventListener('submit', function (event) {
            event.preventDefault();

            const emailValid = emailRegex.test(emailInput.value.trim());
            const passwordValid = passwordInput.value.trim() !== '';

            emailInput.classList.toggle('is-invalid', !emailValid);
            passwordInput.classList.toggle('is-invalid', !passwordValid);

            if (!emailValid || !passwordValid) {
                alert('Please enter a valid email and password.');
                return;
            }

            window.location.href = 'dashboard.html';
        });
    </script>
</body>
</html>
