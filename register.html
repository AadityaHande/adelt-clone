<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register | Adelt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="min-vh-100 d-flex align-items-center py-4">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-12 col-md-10 col-lg-7 col-xl-6">
          <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-4 p-md-5">
              <h1 class="h3 fw-bold mb-2 text-center">Create account</h1>
              <p class="text-secondary text-center mb-4">Simple email, phone, and password validation</p>

              <form id="registerForm" novalidate>
                <div class="mb-3">
                  <label for="regEmail" class="form-label">Email address</label>
                  <input type="email" class="form-control" id="regEmail" placeholder="name@example.com">
                  <div class="invalid-feedback">Please enter a valid email.</div>
                </div>

                <div class="mb-3">
                  <label for="phone" class="form-label">Phone number</label>
                  <input type="tel" class="form-control" id="phone" placeholder="10 digit phone number">
                  <div class="invalid-feedback">Enter a 10 digit phone number.</div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Password</label>
                  <input type="password" class="form-control" id="password" placeholder="Create a password">
                  <div class="invalid-feedback">Use 8+ chars with 1 capital, 1 small, 1 number, and 1 special character.</div>
                </div>

                <button type="submit" class="btn btn-dark w-100">Register</button>
              </form>

              <div id="successMsg" class="alert alert-success d-none mt-3 mb-0" role="alert">
                Registration successful.
              </div>

              <div class="text-center mt-4">
                <a href="login.html" class="btn btn-outline-secondary">Back to Login</a>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const registerForm = document.getElementById('registerForm');
    const regEmail = document.getElementById('regEmail');
    const phone = document.getElementById('phone');
    const password = document.getElementById('password');
    const successMsg = document.getElementById('successMsg');
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

    registerForm.addEventListener('submit', function (event) {
      event.preventDefault();

      const emailValid = emailRegex.test(regEmail.value.trim());
      const phoneValid = /^[0-9]{10}$/.test(phone.value.trim());
      const passwordValid = passwordRegex.test(password.value.trim());

      regEmail.classList.toggle('is-invalid', !emailValid);
      phone.classList.toggle('is-invalid', !phoneValid);
      password.classList.toggle('is-invalid', !passwordValid);

      if (!emailValid || !phoneValid || !passwordValid) {
        successMsg.classList.add('d-none');
        return;
      }

      successMsg.classList.remove('d-none');
      registerForm.reset();
      regEmail.classList.remove('is-invalid');
      phone.classList.remove('is-invalid');
      password.classList.remove('is-invalid');
    });
  </script>
</body>
</html>
