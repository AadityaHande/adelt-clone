<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Adelt</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    :root{--brand:#ff661a;--bg:#fbfaf7;--white:#ffffff;--muted:#575757;--panel-shadow:0 28px 70px rgba(39,38,43,0.08);}
    body{background:linear-gradient(180deg,var(--white) 0%,var(--bg) 100%);color:#27262b}
    .navbar{background:linear-gradient(90deg,var(--brand),#d95311);box-shadow:0 6px 20px rgba(39,38,43,0.06)}
    .navbar .navbar-brand{font-weight:700}
    .card{border:1px solid rgba(39,38,43,0.06);box-shadow:var(--panel-shadow)}
    .small-rule{width:62px;height:4px;border-radius:999px;background:var(--brand)}
    .brand-chip{background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.08);letter-spacing:.12em}
    .card .card-body h6{color:#6b6b6b;font-weight:600}
    .display-6{font-size:2rem;font-weight:700}
    .text-muted{color:var(--muted)!important}
    .btn-brand{background:var(--brand);color:#fff;border:none}
    .btn-outline-brand{border:1px solid rgba(255,102,26,0.18);color:var(--brand);background:transparent}
    .btn-logout{background:var(--white);color:var(--brand);border:1px solid rgba(39,38,43,0.06);font-weight:600;border-radius:.35rem}
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand-lg">
    <div class="container">
      <a class="navbar-brand text-white" href="index.html">Adelt Dashboard</a>
      <div class="d-flex align-items-center">
        <span class="text-white me-3">Signed in as <strong>Admin</strong></span>
        <a href="index.html" class="btn btn-logout btn-sm">Logout</a>
      </div>
    </div>
  </nav>

  <main class="py-5">
    <div class="container">
      <div class="row mb-4">
        <div class="col-12 text-center">
          <h1 class="h3 mb-1">Welcome back, Admin</h1>
          <p class="text-muted">A Dashboard overview</p>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-sm-6 col-md-4">
          <div class="card">
            <div class="card-body">
              <h6 class="card-title">Projects</h6>
              <p class="display-6 mb-0">8</p>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-4">
          <div class="card">
            <div class="card-body">
              <h6 class="card-title">Clients</h6>
              <p class="display-6 mb-0">12</p>
            </div>
          </div>
        </div>
        <div class="col-sm-6 col-md-4">
          <div class="card">
            <div class="card-body">
              <h6 class="card-title">Open Tasks</h6>
              <p class="display-6 mb-0">5</p>
            </div>
          </div>
        </div>
      </div>

      <div class="row">
        <div class="col-12">
          <div class="card">
            <div class="card-header">Recent activity</div>
            <div class="card-body p-0">
              <ul class="list-group list-group-flush">
                <li class="list-group-item">Published new case study : "Brand refresh for Popat Misal"</li>
                <li class="list-group-item">Scheduled social campaign for Spider Man</li>
                <li class="list-group-item">Updated pricing page</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
